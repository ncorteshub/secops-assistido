[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secops_core"
version = "0.1.0"
description = "Pipeline SecOps de geracao, normalizacao (LGMS) e deteccao de anomalias em logs"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "jinja2>=3.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["secops_core*", "api*", "dashboard*"]

[tool.setuptools.package-data]
"*" = ["*.j2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["testes", "tests"]
